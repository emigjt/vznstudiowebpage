<!doctype html>
<!--
  Template for the share image and the icons (not part of the site).
  tools/make-brand-images.mjs opens this page and photographs it:
    ?view=share          1200 x 630   assets/brand/share.jpg  (link previews)
    ?view=icon&size=512  square       assets/brand/eye-icon-512.png, -192, -180, -32
  It uses the site's own fonts, colours and eye mark, so re-run the tool after
  changing any of those.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Gamiya Retro"; src: url("../../fonts/GamiyaRetro-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; src: url("../../fonts/InterTight-Regular.woff2") format("woff2"); }
  :root { --bg: #1c1b1b; --text: #e8e7e3; --muted: #acabab; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); overflow: hidden; }

  /* The mark with the artwork's soft edge and glow */
  .mark { position: relative; }
  .mark img { display: block; width: 100%; height: auto; }
  .mark .glow { position: absolute; inset: 0; opacity: 0.5; filter: blur(calc(var(--mark) * 0.012)); }
  .mark .sharp { position: relative; filter: blur(calc(var(--mark) * 0.0022)); }

  /* Share image */
  .share { position: relative; width: 1200px; height: 630px; padding: 56px 64px; display: none; }
  .share .corner { position: absolute; font: 400 19px/1 "Inter Tight", sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .share .tl { left: 64px; top: 56px; } .share .tr { right: 64px; top: 56px; }
  .share .bl { left: 64px; bottom: 56px; } .share .br { right: 64px; bottom: 56px; }
  .share .mark { --mark: 430px; position: absolute; right: 96px; top: 50%; width: 430px; translate: 0 -50%; }
  .share .words { position: absolute; left: 64px; top: 50%; translate: 0 -50%; }
  .share h1 { font: 400 112px/0.95 "Gamiya Retro", sans-serif; letter-spacing: -0.01em; }
  .share p { margin-top: 18px; font: 400 40px/1.05 "Gamiya Retro", sans-serif; }
  .share em { font-style: normal; }

  /* Icons */
  .icon { position: relative; width: 100vw; height: 100vw; display: none; place-items: center; }
  .icon .mark { --mark: 74vw; width: 74vw; }
  .icon.is-tiny .mark .glow { display: none; }   /* at 32px a glow only muddies the shape */
  .icon.is-tiny .mark .sharp { filter: none; }
  .icon.is-tiny .mark { width: 84vw; }
  .icon.is-tiny .mark img { content: url("../eye-white.svg"); }

  body.view-share .share { display: block; }
  body.view-icon .icon { display: grid; }
</style>
</head>
<body>
  <div class="share">
    <span class="corner tl">Vision Studio Co.</span>
    <span class="corner tr">VZN</span>
    <span class="corner bl">Audio</span>
    <span class="corner br">Visual</span>
    <div class="words">
      <h1>Vision<br>Studios</h1>
      <p>your sound. your <em>vision.</em></p>
    </div>
    <div class="mark"><img class="glow" src="../eye-grey.svg" alt=""><img class="sharp" src="../eye-grey.svg" alt=""></div>
  </div>
  <div class="icon">
    <div class="mark"><img class="glow" src="../eye-grey.svg" alt=""><img class="sharp" src="../eye-grey.svg" alt=""></div>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    document.body.classList.add(q.get("view") === "icon" ? "view-icon" : "view-share");
    if (+q.get("size") <= 48) document.querySelector(".icon").classList.add("is-tiny");
  </script>
</body>
</html>
